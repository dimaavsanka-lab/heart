<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Выздоравливай</title>
<style>
:root{color-scheme:dark;background:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}html{background:#000}
body{color:#f2f2f2;font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bg{z-index:-1;pointer-events:none}
h1{position:fixed;left:0;right:0;bottom:calc(10vh + env(safe-area-inset-bottom,0px));margin:0;text-align:center;font-weight:200;font-size:clamp(32px,9.5vw,54px);letter-spacing:.05em;pointer-events:none;filter:drop-shadow(0 0 18px rgba(255,110,175,.5)) drop-shadow(0 2px 8px rgba(0,0,0,.65))}
h1 .l{display:inline-block;animation:pop .8s cubic-bezier(.2,1.5,.4,1) both}
h1 .l i{display:inline-block;font-style:normal;background:linear-gradient(115deg,#ffe3f0 0%,#ff9cc6 30%,#ff5fa8 50%,#ffc6de 70%,#ff8ab9 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:wave 3.4s ease-in-out infinite,shine 6s linear infinite}
h1 .dh{display:inline-block;width:.4em;margin:0 .25em;color:#ff8ab9;vertical-align:.55em;animation:beat 1.7s ease-in-out infinite}
h1 .dh svg{display:block;width:100%;height:auto}
@keyframes pop{0%{opacity:0;transform:translateY(26px) scale(.55)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shine{0%{background-position:0% 0}100%{background-position:250% 0}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){h1 .l,h1 .l i,h1 .dh{animation:none}}
.pop{position:fixed;pointer-events:none;width:22px;color:#ff7ab8;animation:up 2.4s ease-out forwards}
.pop svg{width:100%;height:auto;display:block}
@keyframes up{0%{opacity:.9;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-180px) scale(1.1)}}
#fb{position:fixed;left:50%;top:42%;width:min(70vw,300px);transform:translate(-50%,-50%);touch-action:none;cursor:grab;display:none}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<h1 id="title" aria-label="Выздоравливай"></h1>
<svg id="fb" viewBox="0 0 24 24"><defs><radialGradient id="g" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffc2de"/><stop offset=".5" stop-color="#ff6fa8"/><stop offset="1" stop-color="#c2336f"/></radialGradient></defs><path fill="url(#g)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var heartSvg='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
  (function title(){
    var w="Выздоравливай",s='<span class="dh">'+heartSvg+'</span>';
    for(var i=0;i<w.length;i++){
      s+='<span class="l" style="animation-delay:'+(i*0.05)+'s"><i style="animation-delay:'+(i*0.09)+'s,'+(i*0.3)+'s">'+w[i]+'</i></span>';
    }
    s+='<span class="dh">'+heartSvg+'</span>';
    document.getElementById("title").innerHTML=s;
  })();
  function pops(x,y){
    for(var k=0;k<6;k++){
      var s=document.createElement("span");
      s.className="pop";s.innerHTML=heartSvg;
      s.style.left=(x-11+(Math.random()-.5)*60)+"px";
      s.style.top=(y-11+(Math.random()-.5)*40)+"px";
      s.style.animationDelay=(k*0.08)+"s";
      document.body.appendChild(s);
      (function(el){setTimeout(function(){el.remove()},2700)})(s);
    }
  }
  function fallback(){
    var f=document.getElementById("fb");f.style.display="block";
    var d=false,ox=0,oy=0,px=0,py=0,mv=false;
    f.addEventListener("pointerdown",function(e){d=true;mv=false;ox=e.clientX;oy=e.clientY;f.setPointerCapture(e.pointerId)});
    f.addEventListener("pointermove",function(e){if(!d)return;var dx=e.clientX-ox,dy=e.clientY-oy;if(Math.abs(dx)+Math.abs(dy)>3)mv=true;px+=dx;py+=dy;ox=e.clientX;oy=e.clientY;f.style.transform="translate(calc(-50% + "+px+"px),calc(-50% + "+py+"px))"});
    f.addEventListener("pointerup",function(e){d=false;if(!mv)pops(e.clientX,e.clientY)});
  }
  try{
    if(!window.THREE) throw 0;
    var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    document.body.insertBefore(renderer.domElement,document.body.firstChild);
    var cv=renderer.domElement;
    var scene=new THREE.Scene();
    var camera=new THREE.PerspectiveCamera(35,1,0.1,100);
    camera.position.set(0,0,7.2);

    var sh=new THREE.Shape(),N=120;
    for(var i=0;i<=N;i++){
      var t=i/N*Math.PI*2;
      var x=16*Math.pow(Math.sin(t),3)/16;
      var y=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16;
      if(i===0)sh.moveTo(x,y);else sh.lineTo(x,y);
    }
    var geo=new THREE.ExtrudeGeometry(sh,{depth:0.35,bevelEnabled:true,bevelThickness:0.32,bevelSize:0.2,bevelOffset:-0.1,bevelSegments:16,curveSegments:48});
    geo.center();
    var mat=new THREE.MeshPhysicalMaterial({color:0xff6fa8,roughness:0.22,metalness:0.05,clearcoat:1,clearcoatRoughness:0.12});
    var heart=new THREE.Mesh(geo,mat);
    heart.scale.setScalar(1.9);
    scene.add(heart);

    scene.add(new THREE.AmbientLight(0xffd6e8,0.55));
    var key=new THREE.DirectionalLight(0xffffff,0.8);key.position.set(0,3,7);scene.add(key);
    var fl=new THREE.PointLight(0xff9ad0,0.7,30);fl.position.set(-5,0,4);scene.add(fl);var fr=new THREE.PointLight(0xff9ad0,0.7,30);fr.position.set(5,0,4);scene.add(fr);
    var back=new THREE.PointLight(0xff4f9a,0.9,30);back.position.set(0,2,-5);scene.add(back);

    var W=1,H=1,upp=0.01,halfW=2,halfH=2,needsRender=true;
    function resize(){
      W=window.innerWidth;H=window.innerHeight;
      renderer.setSize(W,H,false);
      var base=Math.min(W*0.8,340);
      upp=4.54/base;
      var vh=upp*H;
      camera.fov=2*Math.atan(vh/2/7.2)*180/Math.PI;
      camera.aspect=W/H;camera.updateProjectionMatrix();
      halfW=upp*W/2-1.1;halfH=vh/2-1.1;
      heart.position.x=Math.max(-halfW,Math.min(halfW,heart.position.x));
      heart.position.y=Math.max(-halfH,Math.min(halfH,heart.position.y));
      needsRender=true;
    }
    heart.position.y=0.55;
    resize();window.addEventListener("resize",resize);

    var ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
    function hit(e){
      ndc.set(e.clientX/W*2-1,-(e.clientY/H)*2+1);
      ray.setFromCamera(ndc,camera);
      return ray.intersectObject(heart).length>0;
    }
    var dragging=false,moved=false,lx=0,ly=0,vx=0,tilt=0,tiltX=0;
    cv.addEventListener("pointerdown",function(e){
      if(!hit(e))return;
      dragging=true;moved=false;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing";
    });
    cv.addEventListener("pointermove",function(e){
      if(!dragging){cv.style.cursor=hit(e)?"grab":"default";return;}
      var mx=e.clientX-lx,my=e.clientY-ly;
      if(Math.abs(mx)+Math.abs(my)>3)moved=true;
      heart.position.x=Math.max(-halfW,Math.min(halfW,heart.position.x+mx*upp));
      heart.position.y=Math.max(-halfH,Math.min(halfH,heart.position.y-my*upp));
      vx=mx;lx=e.clientX;ly=e.clientY;
    });
    function up(e){
      if(!dragging)return;
      dragging=false;cv.style.cursor="grab";
      if(!moved)pops(e.clientX,e.clientY);
    }
    cv.addEventListener("pointerup",up);
    cv.addEventListener("pointercancel",function(){dragging=false});

    var t0=performance.now();
    (function loop(now){
      requestAnimationFrame(loop);
      vx*=0.85;
      tilt+=((dragging?vx*0.06:0)-tilt)*0.15;
      if(dragging||Math.abs(tilt)>0.0005||needsRender){
        heart.rotation.y=tilt;
        heart.rotation.x=0;
        renderer.render(scene,camera);
        needsRender=false;
      }
    })(t0);
  }catch(e){
    fallback();
  }
})();
</script>
<script>
(function(){
  var c=document.getElementById("bg"),x=c.getContext("2d"),W=1,H=1,dpr=Math.min(window.devicePixelRatio||1,2);
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){W=window.innerWidth;H=window.innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);}
  size();window.addEventListener("resize",size);
  var R=Math.random,i;
  // спрайт звезды (рисуется один раз)
  var starCv=document.createElement("canvas");starCv.width=starCv.height=8;
  var sc2=starCv.getContext("2d");sc2.fillStyle="#ffebf5";sc2.beginPath();sc2.arc(4,4,3.5,0,6.283);sc2.fill();
  // спрайты светящихся пятен (градиент запекается один раз, а не каждый кадр)
  var cols=[[255,70,150],[190,70,255],[255,110,120]];
  function orbSprite(col){
    var s=document.createElement("canvas");s.width=s.height=256;
    var g=s.getContext("2d"),grd=g.createRadialGradient(128,128,0,128,128,128);
    grd.addColorStop(0,"rgba("+col[0]+","+col[1]+","+col[2]+",1)");
    grd.addColorStop(1,"rgba("+col[0]+","+col[1]+","+col[2]+",0)");
    g.fillStyle=grd;g.fillRect(0,0,256,256);return s;
  }
  var stars=[],orbs=[],hs=[],shape=[];
  for(i=0;i<120;i++)stars.push({x:R(),y:R(),r:.4+R()*1.1,p:R()*6.28,s:.4+R()*1.4});
  for(i=0;i<4;i++)orbs.push({x:R(),y:R(),r:.35+R()*.3,vx:(R()-.5)*.00012,vy:(R()-.5)*.00012,img:orbSprite(cols[i%3]),p:R()*6.28});
  for(i=0;i<14;i++)hs.push({x:R(),y:R()*1.2,s:5+R()*12,v:.12+R()*.28,a:.07+R()*.18,p:R()*6.28});
  for(i=0;i<=40;i++){var t=i/40*Math.PI*2;shape.push([16*Math.pow(Math.sin(t),3)/16,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16]);}
  // каждое плавающее сердечко — отдельный спрайт со своей прозрачностью
  for(i=0;i<hs.length;i++){
    var h=hs[i],sz=Math.ceil(h.s*2.6),hc=document.createElement("canvas");
    hc.width=hc.height=sz;
    var hg=hc.getContext("2d");hg.translate(sz/2,sz/2);hg.scale(h.s,h.s);
    hg.fillStyle="rgba(255,110,175,"+h.a+")";
    hg.beginPath();
    for(var k=0;k<shape.length;k++){if(k===0)hg.moveTo(shape[k][0],shape[k][1]);else hg.lineTo(shape[k][0],shape[k][1]);}
    hg.closePath();hg.fill();
    h.cv=hc;
  }
  var T0=performance.now(),last=0;
  (function frame(now){
    requestAnimationFrame(frame);
    if(now-last<33)return; // ~30 fps для фона достаточно
    last=now;
    var t=(now-T0)/1000,m=Math.max(W,H),k;
    x.clearRect(0,0,W,H);
    x.globalCompositeOperation="lighter";
    for(k=0;k<orbs.length;k++){
      var o=orbs[k];
      if(!reduce){o.x+=o.vx;o.y+=o.vy;if(o.x<-.1||o.x>1.1)o.vx*=-1;if(o.y<-.1||o.y>1.1)o.vy*=-1;}
      var rr=o.r*m,a=.13+.05*Math.sin(t*.4+o.p);
      x.globalAlpha=Math.min(1,a);
      x.drawImage(o.img,o.x*W-rr,o.y*H-rr,rr*2,rr*2);
    }
    x.globalCompositeOperation="source-over";
    for(k=0;k<stars.length;k++){
      var s=stars[k];
      x.globalAlpha=.15+.6*(.5+.5*Math.sin(t*s.s+s.p));
      var d2=s.r*2.3;
      x.drawImage(starCv,s.x*W-d2/2,s.y*H-d2/2,d2,d2);
    }
    x.globalAlpha=1;
    for(k=0;k<hs.length;k++){
      var f=hs[k];
      if(!reduce){f.y-=f.v/H;if(f.y<-.05){f.y=1.05;f.x=R();}}
      x.drawImage(f.cv,f.x*W+Math.sin(t*.6+f.p)*14-f.cv.width/2,f.y*H-f.cv.height/2);
    }
  })(T0);
})();
</script>
</body>
</html>
